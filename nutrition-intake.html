<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tell us about your nutrition — Vintus Performance.">
    <title>Nutrition Profile | Vintus Performance</title>

    <link rel="icon" type="image/png" href="images/favicon-256.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=2">
    <link rel="stylesheet" href="css/onboarding.css?v=2">
    <script src="https://brightengine-production.up.railway.app/api/track/c60c83573ea90b0d" async></script>
</head>
<body class="onboarding-page">
    <!-- Minimal Nav -->
    <nav style="display:flex;align-items:center;justify-content:center;padding:1rem 5%;position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(10,10,10,0.98);border-bottom:1px solid rgba(192,192,192,0.1);">
        <a href="/" class="logo"><img src="images/VintusBlankLogo.jpeg" alt="Vintus Performance" class="logo-img"></a>
    </nav>

    <section class="onboard-section">
        <div class="onboard-error" id="onboardError"></div>

        <!-- Step 1: Nutrition Profile -->
        <div class="onboard-step active" data-step="1" id="stepNutrition">
            <h2>Your Nutrition Plan Is Ready to Build</h2>
            <p>A few questions so we can calculate your targets and build your meal plan.</p>

            <div class="onboard-form-section open" data-section="nutrition">
                <div class="onboard-section-body">
                    <div class="onboard-fields-row">
                        <div class="onboard-field">
                            <label for="gender">Gender</label>
                            <select id="gender">
                                <option value="">— Select —</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div class="onboard-field">
                            <label for="mealsPerDay">Meals Per Day</label>
                            <select id="mealsPerDay">
                                <option value="2">2</option>
                                <option value="3" selected>3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                            </select>
                        </div>
                    </div>
                    <div class="onboard-fields-row">
                        <div class="onboard-field">
                            <label for="heightFt">Height</label>
                            <div style="display:flex;gap:0.5rem;">
                                <select id="heightFt" style="flex:1;">
                                    <option value="">ft</option>
                                    <option value="4">4'</option>
                                    <option value="5">5'</option>
                                    <option value="6">6'</option>
                                    <option value="7">7'</option>
                                </select>
                                <select id="heightIn" style="flex:1;">
                                    <option value="">in</option>
                                    <option value="0">0"</option>
                                    <option value="1">1"</option>
                                    <option value="2">2"</option>
                                    <option value="3">3"</option>
                                    <option value="4">4"</option>
                                    <option value="5">5"</option>
                                    <option value="6">6"</option>
                                    <option value="7">7"</option>
                                    <option value="8">8"</option>
                                    <option value="9">9"</option>
                                    <option value="10">10"</option>
                                    <option value="11">11"</option>
                                </select>
                            </div>
                        </div>
                        <div class="onboard-field">
                            <label for="weightLbs">Weight (lbs)</label>
                            <input type="number" id="weightLbs" placeholder="175" min="50" max="600">
                        </div>
                    </div>
                    <div class="onboard-field">
                        <label for="activityLevel">Daily Activity Level</label>
                        <select id="activityLevel">
                            <option value="">— Select —</option>
                            <option value="sedentary">Sedentary — little to no exercise</option>
                            <option value="light">Light — exercise 1-3 days/week</option>
                            <option value="moderate" selected>Moderate — exercise 4-5 days/week</option>
                            <option value="active">Active — daily exercise or physical job</option>
                            <option value="very-active">Very active — intense daily training</option>
                        </select>
                        <p class="onboard-field-note">Used to calculate your daily calorie target.</p>
                    </div>
                    <div class="onboard-field">
                        <label for="dietaryApproach">Diet</label>
                        <select id="dietaryApproach">
                            <option value="">— Select —</option>
                            <option value="no-restriction">No restriction</option>
                            <option value="high-protein">High protein</option>
                            <option value="keto">Keto</option>
                            <option value="vegan">Vegan</option>
                            <option value="vegetarian">Vegetarian</option>
                            <option value="paleo">Paleo</option>
                            <option value="iifym">IIFYM / Flexible</option>
                        </select>
                    </div>
                    <div class="onboard-field">
                        <label for="foodAllergies">Food Allergies / Intolerances (important — we never include these)</label>
                        <textarea id="foodAllergies" rows="2" placeholder="e.g. Peanuts, shellfish, gluten, dairy — or 'none'"></textarea>
                    </div>
                    <div class="onboard-fields-row">
                        <div class="onboard-field">
                            <label for="foodsLoved">Foods You Love (optional)</label>
                            <input type="text" id="foodsLoved" placeholder="e.g. Chicken, rice, salmon">
                        </div>
                        <div class="onboard-field">
                            <label for="foodsHated">Foods You Hate (optional)</label>
                            <input type="text" id="foodsHated" placeholder="e.g. Mushrooms, tofu">
                        </div>
                    </div>
                    <div class="onboard-fields-row">
                        <div class="onboard-field">
                            <label for="cookingSkill">Cooking Skill</label>
                            <select id="cookingSkill">
                                <option value="">— Select —</option>
                                <option value="beginner">Beginner — keep it simple</option>
                                <option value="intermediate">Intermediate</option>
                                <option value="advanced">Advanced</option>
                            </select>
                        </div>
                        <div class="onboard-field">
                            <label for="mealPrepTime">Meal Prep Time Available</label>
                            <select id="mealPrepTime">
                                <option value="">— Select —</option>
                                <option value="minimal">Minimal — quick meals only</option>
                                <option value="moderate">Moderate</option>
                                <option value="extensive">Extensive — I enjoy cooking</option>
                            </select>
                        </div>
                    </div>
                    <div class="onboard-field">
                        <label for="foodBudget">Food Budget</label>
                        <select id="foodBudget">
                            <option value="">— Select —</option>
                            <option value="budget-conscious">Budget-conscious</option>
                            <option value="moderate" selected>Moderate</option>
                            <option value="no-constraint">No constraint</option>
                        </select>
                    </div>
                    <div class="onboard-fields-row">
                        <div class="onboard-field">
                            <label for="chronicConditions">Chronic Conditions (optional)</label>
                            <textarea id="chronicConditions" rows="2" placeholder="e.g. Asthma, high blood pressure"></textarea>
                        </div>
                        <div class="onboard-field">
                            <label for="medications">Medications (optional)</label>
                            <textarea id="medications" rows="2" placeholder="e.g. Blood pressure meds"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <button class="onboard-btn" id="nutritionIntakeBtn">Build My Nutrition Plan</button>
        </div>

        <!-- Step 2: Success -->
        <div class="onboard-step" data-step="2" id="stepSuccess">
            <div class="onboard-success">
                <div class="onboard-success-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <h2>Your Nutrition Plan Is Ready</h2>
                <p>Your personalized calorie targets and meal plan are on your dashboard now.</p>
                <a href="/dashboard" class="onboard-btn" style="display:inline-block;text-decoration:none;text-align:center;max-width:300px;">Go to Dashboard</a>
            </div>
        </div>
    </section>

    <script src="js/config.js?v=2"></script>
    <script src="js/api.js?v=2"></script>
    <script src="js/nutrition-intake.js?v=1"></script>
</body>
</html>
